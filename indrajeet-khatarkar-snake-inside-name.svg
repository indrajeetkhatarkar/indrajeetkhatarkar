<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0b1228"/><stop offset="1" stop-color="#111b3d"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f8fafc"/><stop offset=".42" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>

  <!-- The snake is allowed to appear ONLY inside the actual letters. -->
  <clipPath id="nameClip">
    <text x="600" y="238" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900"
      letter-spacing="1">INDRAJEET KHATARKAR</text>
  </clipPath>

  <path id="insidePath"
    d="M95 226
       C145 170 195 285 245 220
       S345 160 395 226
       S495 290 545 220
       S645 155 695 226
       S795 290 845 220
       S945 165 995 226
       S1080 280 1120 215"/>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="384" rx="22" fill="none" stroke="#263a70" stroke-width="2"/>

<!-- subtle tech grid -->
<g opacity=".13" stroke="#38bdf8">
  <path d="M45 75H1155M45 125H1155M45 175H1155M45 225H1155M45 275H1155M45 325H1155M45 375H1155"/>
  <path d="M80 45V375M160 45V375M240 45V375M320 45V375M400 45V375M480 45V375M560 45V375M640 45V375M720 45V375M800 45V375M880 45V375M960 45V375M1040 45V375M1120 45V375"/>
</g>

<text x="60" y="62" fill="#67e8f9" font-family="monospace" font-size="14" letter-spacing="4">IDENTITY // LIVE</text>
<circle cx="1125" cy="55" r="6" fill="#34d399" filter="url(#glow)">
  <animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="1105" y="62" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">ONLINE</text>

<!-- ambient glow -->
<ellipse cx="600" cy="220" rx="430" ry="65" fill="#38bdf8" opacity=".08" filter="url(#blur)">
  <animate attributeName="cx" values="420;780;420" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- Name -->
<text x="600" y="238" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900"
      letter-spacing="1" fill="url(#name)" stroke="#0b1022" stroke-width="2" paint-order="stroke">
  INDRAJEET KHATARKAR
</text>

<!-- Snake moving THROUGH the letters, clipped to the letter shapes -->
<g clip-path="url(#nameClip)" filter="url(#glow)">
  <path d="M95 226 C145 170 195 285 245 220 S345 160 395 226 S495 290 545 220 S645 155 695 226 S795 290 845 220 S945 165 995 226 S1080 280 1120 215"
        fill="none" stroke="#22d3ee" stroke-width="18" opacity=".18"/>
  <path d="M95 226 C145 170 195 285 245 220 S345 160 395 226 S495 290 545 220 S645 155 695 226 S795 290 845 220 S945 165 995 226 S1080 280 1120 215"
        fill="none" stroke="url(#snake)" stroke-width="6" stroke-linecap="round" stroke-dasharray="20 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-420" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- moving head -->
  <g>
    <circle r="10" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#insidePath"/>
      </animateMotion>
    </circle>
    <circle r="2.5" fill="#fff">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#insidePath"/>
      </animateMotion>
    </circle>
  </g>
</g>

<!-- small "enter / exit" glints around the name -->
<g fill="#67e8f9" filter="url(#glow)">
  <circle cx="92" cy="205" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="250" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
</g>

<text x="600" y="305" text-anchor="middle" fill="#94a3b8"
      font-family="monospace" font-size="13" letter-spacing="3">
  THE SNAKE RUNS THROUGH THE IDENTITY
</text>

<text x="600" y="345" text-anchor="middle" fill="#64748b"
      font-family="monospace" font-size="12" letter-spacing="3">
  BUILD • AUTOMATE • TEST • DEPLOY
</text>

<!-- scanning beam -->
<rect x="48" y="80" width="3" height="280" rx="2" fill="#22d3ee" opacity=".35">
  <animate attributeName="x" values="48;1152;48" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>