<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#020617"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".45" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/>
  </linearGradient>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M35 0H0V35" fill="none" stroke="#64748b" stroke-opacity=".10"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow"><feGaussianBlur stdDeviation="24"/></filter>
  <path id="motion" d="M75 255 C175 195 235 315 340 255 S505 195 610 255 S775 315 880 255 S1045 195 1325 255"/>
</defs>

<rect width="1400" height="360" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="358" rx="23" fill="url(#grid)" stroke="#1e293b"/>

<!-- ambient glow -->
<ellipse cx="700" cy="190" rx="520" ry="110" fill="#22d3ee" opacity=".055" filter="url(#bigGlow)">
  <animate attributeName="opacity" values=".035;.075;.035" dur="4s" repeatCount="indefinite"/>
</ellipse>

<!-- top HUD -->
<g font-family="Inter,Arial,sans-serif">
  <text x="55" y="48" fill="#22d3ee" font-size="12" letter-spacing="3">INDRAJEET // ENGINEERING_PROFILE</text>
  <text x="1345" y="48" text-anchor="end" fill="#64748b" font-size="12" letter-spacing="2">SYSTEM ONLINE ●</text>
</g>

<!-- subtle corner HUD marks -->
<g fill="none" stroke="#334155" stroke-width="1">
  <path d="M35 70h55M35 70v55"/><path d="M1365 70h-55M1365 70v55"/>
  <path d="M35 290h55M35 290v-55"/><path d="M1365 290h-55M1365 290v-55"/>
</g>

<!-- main brand -->
<text x="700" y="155" text-anchor="middle" fill="url(#brand)"
      font-family="Inter,Arial,sans-serif" font-size="82" font-weight="900"
      letter-spacing="16">INDRAJEET</text>

<text x="700" y="190" text-anchor="middle" fill="#cbd5e1"
      font-family="JetBrains Mono,Consolas,monospace" font-size="16" letter-spacing="6">
  SOFTWARE ENGINEER  •  DEVOPS  •  CLOUD  •  AUTOMATION
</text>

<!-- animated snake glow -->
<use href="#motion" fill="none" stroke="#22d3ee" stroke-opacity=".12" stroke-width="24" filter="url(#glow)"/>

<!-- animated snake -->
<use href="#motion" fill="none" stroke="url(#line)" stroke-width="5"
     stroke-linecap="round" stroke-dasharray="2 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="1.8s" repeatCount="indefinite"/>
</use>

<!-- moving head -->
<g filter="url(#glow)">
  <circle r="9" fill="#67e8f9"/>
  <circle r="4" fill="#fff"/>
  <animateMotion dur="5.8s" repeatCount="indefinite" rotate="auto"><mpath href="#motion"/></animateMotion>
</g>

<!-- moving secondary particles -->
<g fill="#38bdf8" opacity=".8">
  <circle cx="0" cy="0" r="2"><animateMotion dur="4.2s" begin="1s" repeatCount="indefinite"><mpath href="#motion"/></animateMotion></circle>
  <circle cx="0" cy="0" r="2"><animateMotion dur="4.2s" begin="2.2s" repeatCount="indefinite"><mpath href="#motion"/></animateMotion></circle>
  <circle cx="0" cy="0" r="2"><animateMotion dur="4.2s" begin="3.1s" repeatCount="indefinite"><mpath href="#motion"/></animateMotion></circle>
</g>

<!-- footer microcopy -->
<g font-family="JetBrains Mono,Consolas,monospace" font-size="12">
  <text x="55" y="325" fill="#64748b">BUILD</text>
  <text x="115" y="325" fill="#22d3ee">→</text>
  <text x="140" y="325" fill="#64748b">AUTOMATE</text>
  <text x="245" y="325" fill="#818cf8">→</text>
  <text x="270" y="325" fill="#64748b">TEST</text>
  <text x="330" y="325" fill="#a78bfa">→</text>
  <text x="355" y="325" fill="#64748b">DEPLOY</text>
  <text x="435" y="325" fill="#34d399">→</text>
  <text x="460" y="325" fill="#64748b">REPEAT</text>
  <text x="1345" y="325" text-anchor="end" fill="#475569">v2.0 / INDRAJEET</text>
</g>
</svg>