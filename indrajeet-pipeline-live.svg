<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="230" rx="26" fill="#050816" stroke="#26314f"/>
<text x="50" y="42" font-family="monospace" font-size="13" fill="#64748b" letter-spacing="4">DELIVERY PIPELINE // LIVE</text>
<path d="M100 125 H1100" stroke="#17243d" stroke-width="8" stroke-linecap="round"/>
<path d="M100 125 H1100" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.2s" repeatCount="indefinite"/></path>
<g font-family="monospace" text-anchor="middle">
  <g transform="translate(100 125)"><circle r="30" fill="#07101f" stroke="#22d3ee" stroke-width="3"/><circle r="7" fill="#22d3ee" filter="url(#gl)"><animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/></circle><text y="55" fill="#e2e8f0" font-size="12">CODE</text></g>
  <g transform="translate(300 125)"><circle r="30" fill="#07101f" stroke="#38bdf8" stroke-width="3"/><circle r="7" fill="#38bdf8"/><text y="55" fill="#e2e8f0" font-size="12">BUILD</text></g>
  <g transform="translate(500 125)"><circle r="30" fill="#07101f" stroke="#818cf8" stroke-width="3"/><circle r="7" fill="#818cf8"/><text y="55" fill="#e2e8f0" font-size="12">TEST</text></g>
  <g transform="translate(700 125)"><circle r="30" fill="#07101f" stroke="#a78bfa" stroke-width="3"/><circle r="7" fill="#a78bfa"/><text y="55" fill="#e2e8f0" font-size="12">DOCKER</text></g>
  <g transform="translate(900 125)"><circle r="30" fill="#07101f" stroke="#34d399" stroke-width="3"/><circle r="7" fill="#34d399"/><text y="55" fill="#e2e8f0" font-size="12">AWS</text></g>
  <g transform="translate(1100 125)"><circle r="30" fill="#07101f" stroke="#34d399" stroke-width="3"/><circle r="7" fill="#34d399" filter="url(#gl)"><animate attributeName="r" values="5;10;5" dur="1.2s" repeatCount="indefinite"/></circle><text y="55" fill="#e2e8f0" font-size="12">DEPLOY</text></g>
</g>
<circle cx="100" cy="125" r="6" fill="#fff"><animate attributeName="cx" values="100;300;500;700;900;1100;100" dur="4s" repeatCount="indefinite"/></circle>
</svg>
