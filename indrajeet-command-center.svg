<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1025"/><stop offset="1" stop-color="#050816"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)" stroke="#26314f"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <text x="48" y="54" fill="#64748b" font-size="14" letter-spacing="4">INDRAJEET // COMMAND CENTER</text>
  <circle cx="1110" cy="48" r="7" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="1130" y="53" fill="#34d399" font-size="12">ONLINE</text>

  <g transform="translate(48 92)">
    <rect width="250" height="190" rx="18" fill="#07101f" stroke="#1f3558"/>
    <circle cx="125" cy="78" r="55" fill="none" stroke="#182a48" stroke-width="10"/>
    <circle cx="125" cy="78" r="55" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-dasharray="210 135" stroke-linecap="round" transform="rotate(-90 125 78)"><animateTransform attributeName="transform" type="rotate" from="-90 125 78" to="270 125 78" dur="5s" repeatCount="indefinite"/></circle>
    <text x="125" y="84" text-anchor="middle" fill="#e2e8f0" font-size="25" font-weight="700">BUILDING</text>
    <text x="125" y="113" text-anchor="middle" fill="#38bdf8" font-size="11" letter-spacing="2">SOFTWARE ENGINEER</text>
    <text x="20" y="160" fill="#94a3b8" font-size="12">MODE</text><text x="210" y="160" text-anchor="end" fill="#e2e8f0" font-size="12">LEARN / SHIP</text>
    <text x="20" y="178" fill="#94a3b8" font-size="12">BASE</text><text x="210" y="178" text-anchor="end" fill="#e2e8f0" font-size="12">INDIA</text>
  </g>

  <g transform="translate(330 92)">
    <rect width="390" height="190" rx="18" fill="#07101f" stroke="#1f3558"/>
    <text x="22" y="34" fill="#e2e8f0" font-size="14" font-weight="700">ACTIVE SYSTEMS</text>
    <g font-size="12">
      <text x="22" y="70" fill="#94a3b8">JAVA / SPRING BOOT</text><rect x="22" y="80" width="320" height="6" rx="3" fill="#14213a"/><rect x="22" y="80" width="270" height="6" rx="3" fill="url(#cyan)"><animate attributeName="width" values="240;285;255;270" dur="3s" repeatCount="indefinite"/></rect>
      <text x="22" y="110" fill="#94a3b8">AWS / CLOUD</text><rect x="22" y="120" width="320" height="6" rx="3" fill="#14213a"/><rect x="22" y="120" width="240" height="6" rx="3" fill="url(#cyan)"><animate attributeName="width" values="210;260;230;240" dur="3.6s" repeatCount="indefinite"/></rect>
      <text x="22" y="150" fill="#94a3b8">DOCKER / CI-CD</text><rect x="22" y="160" width="320" height="6" rx="3" fill="#14213a"/><rect x="22" y="160" width="255" height="6" rx="3" fill="url(#cyan)"><animate attributeName="width" values="230;280;245;255" dur="3.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(752 92)">
    <rect width="400" height="190" rx="18" fill="#07101f" stroke="#1f3558"/>
    <text x="22" y="34" fill="#e2e8f0" font-size="14" font-weight="700">LIVE SIGNAL</text>
    <g fill="#38bdf8" opacity=".7">
      <circle cx="35" cy="76" r="3"><animate attributeName="cy" values="76;68;76" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="76" r="3"><animate attributeName="cy" values="76;48;76" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="105" cy="76" r="3"><animate attributeName="cy" values="76;61;76" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="76" r="3"><animate attributeName="cy" values="76;42;76" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="175" cy="76" r="3"><animate attributeName="cy" values="76;58;76" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="76" r="3"><animate attributeName="cy" values="76;35;76" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="76" r="3"><animate attributeName="cy" values="76;53;76" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="76" r="3"><animate attributeName="cy" values="76;45;76" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="315" cy="76" r="3"><animate attributeName="cy" values="76;64;76" dur="1.25s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M22 78 C70 55 95 90 140 48 S220 72 260 40 S330 70 370 45" fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1 12;12 1;1 12" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="22" y="125" fill="#64748b" font-size="11">NEXT TARGET</text>
    <text x="22" y="150" fill="#e2e8f0" font-size="18" font-weight="700">PRODUCTION-READY ENGINEERING</text>
    <text x="22" y="175" fill="#38bdf8" font-size="11" letter-spacing="2">BUILD • AUTOMATE • TEST • DEPLOY</text>
  </g>
</g>
</svg>
