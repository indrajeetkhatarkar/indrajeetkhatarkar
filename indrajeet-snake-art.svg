<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-opacity=".13"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="324" rx="22" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="324" rx="22" fill="none" stroke="#334155" stroke-opacity=".65"/>

  <circle cx="180" cy="170" r="105" fill="#22d3ee" opacity=".07" filter="url(#soft)"/>
  <circle cx="1010" cy="220" r="130" fill="#8b5cf6" opacity=".08" filter="url(#soft)"/>

  <text x="62" y="70" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="15" letter-spacing="3">
    CONTRIBUTION // LIVE FEED
  </text>

  <text x="62" y="125" fill="#e2e8f0" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700">
    SNAKE PROTOCOL
  </text>

  <text x="62" y="205" fill="url(#neon)" font-family="JetBrains Mono,monospace" font-size="54" font-weight="900" letter-spacing="6" filter="url(#glow)">
    INDRAJEET
  </text>

  <text x="65" y="235" fill="#94a3b8" font-family="JetBrains Mono,monospace" font-size="14">
    BUILD • COMMIT • CONTRIBUTE • REPEAT
  </text>

  <!-- contribution grid -->
  <g transform="translate(650 62)">
    <g fill="#0f172a" stroke="#1e293b">
      <rect x="0" y="0" width="18" height="18" rx="4"/><rect x="25" y="0" width="18" height="18" rx="4"/>
      <rect x="50" y="0" width="18" height="18" rx="4"/><rect x="75" y="0" width="18" height="18" rx="4"/>
      <rect x="100" y="0" width="18" height="18" rx="4"/><rect x="125" y="0" width="18" height="18" rx="4"/>
      <rect x="150" y="0" width="18" height="18" rx="4"/><rect x="175" y="0" width="18" height="18" rx="4"/>
      <rect x="200" y="0" width="18" height="18" rx="4"/><rect x="225" y="0" width="18" height="18" rx="4"/>
      <rect x="250" y="0" width="18" height="18" rx="4"/><rect x="275" y="0" width="18" height="18" rx="4"/>
      <rect x="300" y="0" width="18" height="18" rx="4"/><rect x="325" y="0" width="18" height="18" rx="4"/>
      <rect x="350" y="0" width="18" height="18" rx="4"/>

      <rect x="0" y="25" width="18" height="18" rx="4"/><rect x="25" y="25" width="18" height="18" rx="4"/>
      <rect x="50" y="25" width="18" height="18" rx="4"/><rect x="75" y="25" width="18" height="18" rx="4"/>
      <rect x="100" y="25" width="18" height="18" rx="4"/><rect x="125" y="25" width="18" height="18" rx="4"/>
      <rect x="150" y="25" width="18" height="18" rx="4"/><rect x="175" y="25" width="18" height="18" rx="4"/>
      <rect x="200" y="25" width="18" height="18" rx="4"/><rect x="225" y="25" width="18" height="18" rx="4"/>
      <rect x="250" y="25" width="18" height="18" rx="4"/><rect x="275" y="25" width="18" height="18" rx="4"/>
      <rect x="300" y="25" width="18" height="18" rx="4"/><rect x="325" y="25" width="18" height="18" rx="4"/>
      <rect x="350" y="25" width="18" height="18" rx="4"/>

      <rect x="0" y="50" width="18" height="18" rx="4"/><rect x="25" y="50" width="18" height="18" rx="4"/>
      <rect x="50" y="50" width="18" height="18" rx="4"/><rect x="75" y="50" width="18" height="18" rx="4"/>
      <rect x="100" y="50" width="18" height="18" rx="4"/><rect x="125" y="50" width="18" height="18" rx="4"/>
      <rect x="150" y="50" width="18" height="18" rx="4"/><rect x="175" y="50" width="18" height="18" rx="4"/>
      <rect x="200" y="50" width="18" height="18" rx="4"/><rect x="225" y="50" width="18" height="18" rx="4"/>
      <rect x="250" y="50" width="18" height="18" rx="4"/><rect x="275" y="50" width="18" height="18" rx="4"/>
      <rect x="300" y="50" width="18" height="18" rx="4"/><rect x="325" y="50" width="18" height="18" rx="4"/>
      <rect x="350" y="50" width="18" height="18" rx="4"/>

      <rect x="0" y="75" width="18" height="18" rx="4"/><rect x="25" y="75" width="18" height="18" rx="4"/>
      <rect x="50" y="75" width="18" height="18" rx="4"/><rect x="75" y="75" width="18" height="18" rx="4"/>
      <rect x="100" y="75" width="18" height="18" rx="4"/><rect x="125" y="75" width="18" height="18" rx="4"/>
      <rect x="150" y="75" width="18" height="18" rx="4"/><rect x="175" y="75" width="18" height="18" rx="4"/>
      <rect x="200" y="75" width="18" height="18" rx="4"/><rect x="225" y="75" width="18" height="18" rx="4"/>
      <rect x="250" y="75" width="18" height="18" rx="4"/><rect x="275" y="75" width="18" height="18" rx="4"/>
      <rect x="300" y="75" width="18" height="18" rx="4"/><rect x="325" y="75" width="18" height="18" rx="4"/>
      <rect x="350" y="75" width="18" height="18" rx="4"/>

      <rect x="0" y="100" width="18" height="18" rx="4"/><rect x="25" y="100" width="18" height="18" rx="4"/>
      <rect x="50" y="100" width="18" height="18" rx="4"/><rect x="75" y="100" width="18" height="18" rx="4"/>
      <rect x="100" y="100" width="18" height="18" rx="4"/><rect x="125" y="100" width="18" height="18" rx="4"/>
      <rect x="150" y="100" width="18" height="18" rx="4"/><rect x="175" y="100" width="18" height="18" rx="4"/>
      <rect x="200" y="100" width="18" height="18" rx="4"/><rect x="225" y="100" width="18" height="18" rx="4"/>
      <rect x="250" y="100" width="18" height="18" rx="4"/><rect x="275" y="100" width="18" height="18" rx="4"/>
      <rect x="300" y="100" width="18" height="18" rx="4"/><rect x="325" y="100" width="18" height="18" rx="4"/>
      <rect x="350" y="100" width="18" height="18" rx="4"/>
    </g>

    <!-- neon contribution trail -->
    <g fill="#22d3ee" opacity=".9">
      <rect x="50" y="25" width="18" height="18" rx="4"/>
      <rect x="75" y="25" width="18" height="18" rx="4"/>
      <rect x="100" y="25" width="18" height="18" rx="4"/>
      <rect x="100" y="50" width="18" height="18" rx="4"/>
      <rect x="100" y="75" width="18" height="18" rx="4"/>
      <rect x="125" y="75" width="18" height="18" rx="4"/>
      <rect x="150" y="75" width="18" height="18" rx="4"/>
      <rect x="175" y="75" width="18" height="18" rx="4"/>
      <rect x="175" y="100" width="18" height="18" rx="4"/>
      <rect x="200" y="100" width="18" height="18" rx="4"/>
      <rect x="225" y="100" width="18" height="18" rx="4"/>
    </g>
  </g>

  <!-- animated snake -->
  <g filter="url(#glow)">
    <path d="M610 255 C690 205 745 270 800 225 S900 190 965 245 S1060 280 1130 225"
          fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="28 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-230" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="610" cy="255" r="15" fill="#22d3ee">
      <animate attributeName="cx" values="610;680;760;840;930;1020;1130;610" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="255;220;270;210;245;280;225;255" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="650" y="315" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="12" letter-spacing="2">
    USER: INDRAJEETKHATARKAR
  </text>
  <text x="1085" y="70" fill="#22d3ee" font-family="JetBrains Mono,monospace" font-size="12" text-anchor="end">
    ● LIVE
  </text>
</svg>